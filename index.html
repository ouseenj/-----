<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان</title>
    <style>
        body {
            background-color: #222;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #000;
            border: 3px solid #4CAF50;
            max-width: 90vw;
            max-height: 45vh;
            display: block;
            margin: 0 auto;
        }
        .controls {
            margin-top: 15px;
            display: inline-block;
        }
        .btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .btn:active {
            background-color: #45a049;
        }
        .row {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span> | High Score: <span id="high-score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- أزرار التحكم لمسًا للجوال -->
    <div class="controls">
        <div class="row">
            <button class="btn" onclick="changeDirection('UP')">⬆️</button>
        </div>
        <div class="row">
            <button class="btn" onclick="changeDirection('LEFT')">⬅️</button>
            <button class="btn" onclick="changeDirection('DOWN')">⬇️</button>
            <button class="btn" onclick="changeDirection('RIGHT')">➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const grid = 20;
        let score = 0;
        let highScore = 0;
        let d = "STOP";

        let snake = [{ x: 200, y: 200 }];
        let food = {
            x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
            y: Math.floor(Math.random() * (canvas.height / grid)) * grid
        };

        // التحكم بالكيبورد للكمبيوتر
        document.addEventListener("keydown", direction);
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        // التحكم باللمس للجوال
        function changeDirection(dir) {
            if (dir === "LEFT" && d !== "RIGHT") d = "LEFT";
            if (dir === "UP" && d !== "DOWN") d = "UP";
            if (dir === "RIGHT" && d !== "LEFT") d = "RIGHT";
            if (dir === "DOWN" && d !== "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم الطعام
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, grid, grid);

            // رسم الثعبان
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "black" : "lime";
                ctx.strokeStyle = "green";
                ctx.fillRect(snake[i].x, snake[i].y, grid, grid);
                ctx.strokeRect(snake[i].x, snake[i].y, grid, grid);
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= grid;
            if (d == "UP") snakeY -= grid;
            if (d == "RIGHT") snakeX += grid;
            if (d == "DOWN") snakeY += grid;

            // أكل الطعام
            if (snakeX == food.x && snakeY == food.y) {
                score += 10;
                if (score > highScore) highScore = score;
                document.getElementById("score").innerText = score;
                document.getElementById("high-score").innerText = highScore;

                food = {
                    x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                    y: Math.floor(Math.random() * (canvas.height / grid)) * grid
                };
            } else if (d !== "STOP") {
                snake.pop();
            }

            // إضافة رأس جديد
            let newHead = { x: snakeX, y: snakeY };

            // الاصطدام بالحواف أو الجسم
            if (d !== "STOP") {
                if (
                    snakeX < 0 || snakeX >= canvas.width ||
                    snakeY < 0 || snakeY >= canvas.height ||
                    collision(newHead, snake)
                ) {
                    alert("خسرت! اضغط موافق لإعادة اللعب");
                    snake = [{ x: 200, y: 200 }];
                    d = "STOP";
                    score = 0;
                    document.getElementById("score").innerText = score;
                    return;
                }
                snake.unshift(newHead);
            }
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 120);
    </script>
</body>
</html>
